<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Link de pagamento Pix Fluxo." />
    <title>Fluxo | Link Pix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=20260126-27" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="grid-overlay"></div>
      <div class="scanline"></div>
    </div>

    <header class="topbar" data-topbar>
      <div class="container">
        <a class="brand" href="/">
          <span class="brand-mark"><img src="/logofluxonoback.png" alt="Fluxo" class="brand-logo" /></span>
          <span class="brand-text">
            <span class="brand-name">Fluxo</span>
            <span class="brand-tag">Link Pix</span>
          </span>
        </a>

        <div class="topbar-actions">
        </div>
      </div>
    </header>

    <main class="page">
      <section class="section" data-reveal>
        <div class="section-head">
          <h1>Pagamento Pix</h1>
          <p class="lead">Use o QR Code ou o c&oacute;digo copia e cola para concluir o pagamento.</p>
        </div>
        <div class="card pix-link-card" data-pix-link>
          <div class="card-head">
            <h3>Detalhes da cobran&ccedil;a</h3>
            <span class="tag" data-pix-link-status>--</span>
          </div>
          <p class="lead" data-pix-link-amount>--</p>
          <p class="muted" data-pix-link-description>--</p>
          <label>
            C&oacute;digo Pix
            <textarea data-pix-link-code readonly></textarea>
          </label>
          <div class="pix-actions">
            <button class="btn btn-ghost" type="button" data-pix-link-copy>Copiar c&oacute;digo</button>
            <button class="btn btn-primary" type="button" data-pix-link-copy-url>Copiar link</button>
          </div>
          <div class="muted" data-pix-link-expires></div>
          <div class="muted" data-pix-link-message></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <span>&copy; 2026 Fluxo. Todos os direitos reservados.</span>
        </div>
      </div>
    </footer>

    <script src="/site.js?v=20260126-27"></script>
  </body>
</html>
