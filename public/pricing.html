<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Fluxo gratuito para pagamentos Pix." />
    <title>Fluxo | Gratuito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260126-28" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="orb orb-a"></div>
      <div class="orb orb-b"></div>
      <div class="orb orb-c"></div>
      <div class="grid-overlay"></div>
      <div class="scanline"></div>
    </div>

    <header class="topbar topbar--landing" data-topbar>
      <div class="container">
        <a class="brand" href="/#inicio">
          <span class="brand-mark"><img src="/logofluxonoback.png" alt="Fluxo" class="brand-logo" /></span>
        </a>
        <div class="topbar-actions">
          <a class="btn btn-ghost" href="/console?tab=login">Entrar</a>
          <a class="btn btn-primary" href="/console?tab=login">Abrir conta</a>
        </div>
      </div>
    </header>

    <main class="page landing">
      <section class="hero hero--center" data-reveal>
        <div class="hero-grid">
          <div class="hero-copy">
            <p class="eyebrow">Fluxo gratuito</p>
            <h1>Todos os recursos liberados sem mensalidade.</h1>
            <p class="lead">O Fluxo &eacute; gratuito. Crie sua conta e comece a cobrar via Pix agora mesmo.</p>
            <div class="hero-actions">
              <a class="btn btn-primary" href="/console?tab=login">Abrir conta</a>
              <a class="btn btn-ghost" href="/#plataforma">Ver plataforma</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="site.js?v=20260126-28"></script>
  </body>
</html>
